# AWS Secrets for Kubernetes (optional — only needed for real AWS SNS)
# Create this secret by running:
#   kubectl create secret generic aws-secrets \
#     --from-literal=access-key=YOUR_AWS_ACCESS_KEY_ID \
#     --from-literal=secret-key=YOUR_AWS_SECRET_ACCESS_KEY
#
# Or apply this file after replacing the base64-encoded values:
#   echo -n "YOUR_KEY" | base64

apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
type: Opaque
data:
  # Replace with: echo -n "AKIAIOSFODNN7EXAMPLE" | base64
  access-key: ""
  # Replace with: echo -n "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" | base64
  secret-key: ""
