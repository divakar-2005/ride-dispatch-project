# ── Backend Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-dispatch-backend
  labels:
    app: ride-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-backend
  template:
    metadata:
      labels:
        app: ride-backend
    spec:
      containers:
      - name: backend
        image: ride-dispatch-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: access-key
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: secret-key
              optional: true
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: ride-backend-service
spec:
  selector:
    app: ride-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
